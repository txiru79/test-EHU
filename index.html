<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1c2b39">
<title>Test EHU · Escala Administrativa</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#1c2b39;
    --ink-soft:#3a4d5c;
    --paper:#f5f2ec;
    --paper-card:#ffffff;
    --line:#dfd9cb;
    --accent:#a9762f;
    --accent-soft:#f0e2c9;
    --good:#3f7a5d;
    --good-bg:#e2efe7;
    --bad:#a6403a;
    --bad-bg:#f6e4e2;
    --radius:10px;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'URW Palladio', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  [data-theme="dark"]{
    --ink:#e9e4d6;
    --ink-soft:#b9b3a2;
    --paper:#141f29;
    --paper-card:#1b2b38;
    --line:#2c3d4a;
    --accent:#d3a45c;
    --accent-soft:#3a3020;
    --good:#6fbf94;
    --good-bg:#1e332a;
    --bad:#e08079;
    --bad-bg:#3a2220;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:20px 18px 60px;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
    margin-bottom:22px;
  }
  header.top .brand{
    font-family:var(--serif);
    font-size:1.15rem;
    letter-spacing:.2px;
  }
  header.top .brand small{
    display:block;
    font-family:var(--sans);
    font-size:.68rem;
    color:var(--ink-soft);
    letter-spacing:.4px;
    margin-top:2px;
  }
  button.iconbtn{
    background:none;
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink);
    width:36px;height:36px;
    font-size:1rem;
    cursor:pointer;
  }
  /* ---------- Home / mode selection ---------- */
  .modes{display:flex;flex-direction:column;gap:14px;}
  .mode-card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px;
    cursor:pointer;
    text-align:left;
    font-family:var(--sans);
    color:var(--ink);
    transition:border-color .15s ease;
  }
  .mode-card:hover{border-color:var(--accent);}
  .mode-card h3{
    margin:0 0 4px;
    font-family:var(--serif);
    font-size:1.08rem;
    font-weight:normal;
  }
  .mode-card p{
    margin:0;
    font-size:.86rem;
    color:var(--ink-soft);
    line-height:1.45;
  }
  .stats-strip{
    display:flex;
    gap:10px;
    margin:20px 0 4px;
  }
  .stats-strip .box{
    flex:1;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 8px;
    text-align:center;
  }
  .stats-strip .box .n{
    font-family:var(--serif);
    font-size:1.3rem;
    display:block;
  }
  .stats-strip .box .l{
    font-size:.68rem;
    color:var(--ink-soft);
  }
  /* ---------- Setup panel ---------- */
  .panel{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
  }
  .panel h3{font-family:var(--serif);font-weight:normal;margin-top:0;}
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:.78rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  input[type=number]{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
    font-size:.95rem;
  }
  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:.86rem;
  }
  .toggle-row:last-child{border-bottom:none;}
  .switch{
    position:relative;width:40px;height:22px;flex:none;
  }
  .switch input{opacity:0;width:0;height:0;}
  .slider{
    position:absolute;cursor:pointer;inset:0;
    background:var(--line);border-radius:22px;transition:.15s;
  }
  .slider:before{
    content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;
    background:var(--paper-card);border-radius:50%;transition:.15s;
  }
  input:checked + .slider{background:var(--accent);}
  input:checked + .slider:before{transform:translateX(18px);}
  .btn{
    display:inline-block;
    width:100%;
    padding:13px 16px;
    border-radius:8px;
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-size:.95rem;
    font-family:var(--sans);
    cursor:pointer;
    margin-top:6px;
  }
  [data-theme="dark"] .btn{background:var(--accent);color:#1a1408;}
  .btn.secondary{
    background:none;
    border:1px solid var(--line);
    color:var(--ink);
  }
  .back-link{
    display:inline-block;
    margin-bottom:16px;
    color:var(--ink-soft);
    font-size:.84rem;
    text-decoration:none;
    cursor:pointer;
  }
  /* ---------- Quiz ---------- */
  .quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:.8rem;
    color:var(--ink-soft);
  }
  .quiz-top .timer{
    font-family:var(--serif);
    font-size:1.05rem;
    color:var(--ink);
  }
  .quiz-top .timer.low{color:var(--bad);}
  .stop-link{color:var(--accent);text-decoration:underline;cursor:pointer;}
  .progress-bar{
    height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px;
  }
  .progress-bar .fill{height:100%;background:var(--accent);transition:width .2s;}
  .q-num{
    font-size:.78rem;
    color:var(--accent);
    letter-spacing:.4px;
    margin-bottom:6px;
  }
  .q-stem{
    font-family:var(--serif);
    font-size:1.18rem;
    line-height:1.45;
    margin:0 0 20px;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    text-align:left;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 14px;
    font-size:.94rem;
    line-height:1.4;
    cursor:pointer;
    color:var(--ink);
    font-family:var(--sans);
  }
  .opt .tag{
    flex:none;
    width:24px;height:24px;
    border-radius:6px;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;
    font-family:var(--serif);
    color:var(--ink-soft);
  }
  .opt.correct{background:var(--good-bg);border-color:var(--good);}
  .opt.correct .tag{background:var(--good);border-color:var(--good);color:#fff;}
  .opt.incorrect{background:var(--bad-bg);border-color:var(--bad);}
  .opt.incorrect .tag{background:var(--bad);border-color:var(--bad);color:#fff;}
  .opt.selected{border-color:var(--accent);}
  .opt.selected .tag{background:var(--accent);border-color:var(--accent);color:#fff;}
  .opt:disabled, .opt.disabled{cursor:default;}
  .quiz-nav{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  .quiz-nav .btn{margin-top:0;}
  .flag-btn{
    background:none;border:1px solid var(--line);color:var(--ink-soft);
    border-radius:8px;width:44px;flex:none;font-size:1rem;cursor:pointer;
  }
  .flag-btn.on{color:var(--accent);border-color:var(--accent);}
  /* ---------- Results ---------- */
  .result-hero{
    text-align:center;
    padding:30px 10px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:20px;
  }
  .result-hero .score{
    font-family:var(--serif);
    font-size:2.6rem;
  }
  .result-hero .label{color:var(--ink-soft);font-size:.9rem;margin-top:4px;}
  .fail-item{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
  }
  .fail-item .q-num{margin-bottom:4px;}
  .fail-item .stem{font-family:var(--serif);margin-bottom:8px;}
  .fail-item .ans{font-size:.86rem;margin:3px 0;}
  .fail-item .ans.correct{color:var(--good);}
  .fail-item .ans.incorrect{color:var(--bad);text-decoration:line-through;}

  .print-only{display:none;}
  @media print{
    body{background:#fff;color:#111;}
    .no-print{display:none !important;}
    .print-only{display:block !important;}
    .wrap{max-width:100%;padding:0;}
    .print-item{page-break-inside:avoid;border-bottom:1px solid #ccc;padding:10px 0;}
    .print-item .q-num{color:#a9762f;font-size:.75rem;}
    .print-item .stem{font-family:Georgia,serif;font-size:1rem;margin:4px 0 6px;}
    .print-item .ans{font-size:.88rem;margin:2px 0;}
    .print-item .ans.correct{color:#2f6b4a;}
    .print-item .ans.incorrect{color:#a6403a;text-decoration:line-through;}
    .print-header{margin-bottom:14px;}
    .print-header h1{font-family:Georgia,serif;font-size:1.3rem;margin:0 0 4px;}
    .print-header p{font-size:.82rem;color:#555;margin:0;}
  }
  .hidden{display:none !important;}
  .skipnav{
    display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;
  }
  .skipnav button{
    width:30px;height:30px;font-size:.72rem;
    border-radius:6px;border:1px solid var(--line);
    background:var(--paper-card);color:var(--ink-soft);cursor:pointer;
  }
  .skipnav button.cur{border-color:var(--accent);color:var(--accent);}
  .skipnav button.answered{background:var(--accent-soft);}

  .topic-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .topic-chips .chip{
    font-family:var(--sans);
    font-size:.78rem;
    padding:7px 12px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .topic-chips .chip.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  #splash{
    position:fixed;inset:0;
    background:#ffffff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:999;
    transition:opacity .35s ease;
  }
  #splash img{
    width:132px;height:132px;
    animation:splashPop .5s ease;
  }
  #splash .splash-title{
    margin-top:14px;
    font-family:var(--serif);
    font-size:1.05rem;
    color:#1c2b39;
    letter-spacing:.3px;
  }
  #splash.hide{opacity:0;pointer-events:none;}
  @keyframes splashPop{
    from{opacity:0;transform:scale(.9);}
    to{opacity:1;transform:scale(1);}
  }
</style>
</head>
<body>
<div id="splash">
  <img src="logo-splash.png" alt="EHU">
  <div class="splash-title">Test EHU</div>
</div>
<div class="wrap" id="app"></div>

<script src="data.js"></script>
<script src="topics.js"></script>
<script>
/* ============ Estado y almacenamiento ============ */
const STORAGE_KEY = 'ehu_admin_stats_v1';
const PREFS_KEY = 'ehu_admin_prefs_v1';

function loadStats(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ return {}; }
}
function saveStats(s){ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
function loadPrefs(){
  try{ return JSON.parse(localStorage.getItem(PREFS_KEY)) || {theme:'light'}; }catch(e){ return {theme:'light'}; }
}
function savePrefs(p){ localStorage.setItem(PREFS_KEY, JSON.stringify(p)); }

let stats = loadStats();     // { [num]: {seen:n, correct:n, lastWrong:bool} }
let prefs = loadPrefs();
document.documentElement.setAttribute('data-theme', prefs.theme === 'dark' ? 'dark' : 'light');

function recordAnswer(num, wasCorrect){
  const s = stats[num] || {seen:0, correct:0, lastWrong:false};
  s.seen += 1;
  if(wasCorrect){ s.correct += 1; s.lastWrong = false; }
  else{ s.lastWrong = true; }
  stats[num] = s;
  saveStats(stats);
}

function statsSummary(){
  const nums = Object.keys(stats);
  const attempted = nums.length;
  let correctTotal = 0, seenTotal = 0, failing = 0;
  nums.forEach(n=>{
    correctTotal += stats[n].correct;
    seenTotal += stats[n].seen;
    if(stats[n].lastWrong) failing++;
  });
  const pct = seenTotal ? Math.round(100*correctTotal/seenTotal) : 0;
  return {attempted, pct, failing, total: EHU_QUESTIONS.length};
}

/* ============ Utilidades ============ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function normalizeText(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function questionByNum(n){ return EHU_QUESTIONS.find(q=>q[0]===n); }

// Algunas preguntas (22, 378, 409) tienen un error reconocido en el enunciado
// original y admiten dos respuestas válidas (q[4] es la segunda, si existe).
function correctSet(q){
  return q.length > 4 ? [q[3], q[4]] : [q[3]];
}
function isCorrect(q, selectedIdx){
  return correctSet(q).includes(selectedIdx);
}

/* ============ Router simple ============ */
const app = document.getElementById('app');
let session = null; // sesión de test activa
let timerInterval = null;

function go(view, params){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  render(view, params||{});
}

/* ============ Vistas ============ */
function render(view, params){
  if(view === 'home') return renderHome();
  if(view === 'stats') return renderStatsPage();
  if(view === 'setup-full') return renderSetupFull();
  if(view === 'setup-fails') return renderSetupFails();
  if(view === 'quiz') return renderQuiz();
  if(view === 'results') return renderResults();
}

function headerHTML(title, sub){
  return `
  <header class="top no-print">
    <div class="brand">${title}<small>${sub}</small></div>
    <button class="iconbtn" id="themeBtn" title="Modo oscuro">${prefs.theme==='dark'?'☀':'☾'}</button>
  </header>`;
}

function attachThemeToggle(){
  const b = document.getElementById('themeBtn');
  if(!b) return;
  b.onclick = ()=>{
    prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark';
    savePrefs(prefs);
    document.documentElement.setAttribute('data-theme', prefs.theme);
    b.textContent = prefs.theme==='dark' ? '☀' : '☾';
  };
}

function renderHome(){
  const s = statsSummary();
  app.innerHTML = `
    ${headerHTML('Test EHU','Escala Administrativa · Grupo C1')}
    <div class="stats-strip">
      <div class="box"><span class="n">${s.attempted}</span><span class="l">preguntas vistas</span></div>
      <div class="box"><span class="n">${s.pct}%</span><span class="l">aciertos</span></div>
      <div class="box"><span class="n">${s.failing}</span><span class="l">para repasar</span></div>
    </div>
    <a class="back-link" id="statsLink" style="margin:8px 0 0;">Ver estadísticas por materia ›</a>
    <div class="modes" style="margin-top:14px;">
      <button class="mode-card" id="m-full">
        <h3>Batería completa</h3>
        <p>Las 500 preguntas oficiales. Elige el rango, el orden y si quieres tiempo límite.</p>
      </button>
      <button class="mode-card" id="m-sim">
        <h3>Simulacro de examen</h3>
        <p>60 preguntas al azar, 80 minutos, sin penalización por fallo. El formato real del ejercicio.</p>
      </button>
      <button class="mode-card" id="m-fails">
        <h3>Repaso de fallos</h3>
        <p>${s.failing ? `Solo las ${s.failing} preguntas que tienes falladas ahora mismo.` : 'Aún no tienes preguntas falladas pendientes.'}</p>
      </button>
    </div>
    <p style="font-size:.72rem;color:var(--ink-soft);margin-top:24px;line-height:1.5;">
      Preguntas: batería oficial de la OPE 2023-2024 (UPV/EHU). Respuestas contrastadas de forma independiente,
      no son una plantilla oficial de la universidad. Si detectas un error, revísalo contra la fuente antes de darlo por bueno.
    </p>
  `;
  attachThemeToggle();
  document.getElementById('statsLink').onclick = ()=>go('stats');
  document.getElementById('m-full').onclick = ()=>go('setup-full');
  document.getElementById('m-sim').onclick = ()=>startSimulacro();
  document.getElementById('m-fails').onclick = ()=>{
    if(s.failing) go('setup-fails');
  };
}

function topicBreakdown(){
  const byTopic = {};
  EHU_QUESTIONS.forEach(q=>{
    const topic = EHU_TOPICS[q[0]] || 'Otros';
    if(!byTopic[topic]) byTopic[topic] = {total:0, attempted:0, seen:0, correct:0};
    byTopic[topic].total++;
    const s = stats[q[0]];
    if(s){
      byTopic[topic].attempted++;
      byTopic[topic].seen += s.seen;
      byTopic[topic].correct += s.correct;
    }
  });
  return TOPIC_LIST.map(name=>{
    const b = byTopic[name] || {total:0, attempted:0, seen:0, correct:0};
    const pct = b.seen ? Math.round(100*b.correct/b.seen) : null;
    return {name, ...b, pct};
  }).sort((a,b)=>{
    // las que tienen % conocido y más bajo primero; sin practicar, al final
    if(a.pct===null && b.pct===null) return 0;
    if(a.pct===null) return 1;
    if(b.pct===null) return -1;
    return a.pct - b.pct;
  });
}

function exportProgress(){
  const payload = {app:'test-ehu', exportedAt: new Date().toISOString(), stats};
  const blob = new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const d = new Date();
  const stamp = d.toISOString().slice(0,10);
  a.download = `progreso-test-ehu-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function importProgressFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    let data;
    try{
      data = JSON.parse(e.target.result);
    }catch(err){
      alert('Ese archivo no se puede leer. Asegúrate de elegir un archivo de progreso exportado desde esta app.');
      return;
    }
    if(!data || typeof data.stats !== 'object'){
      alert('Ese archivo no tiene el formato esperado.');
      return;
    }
    if(confirm('Esto va a reemplazar tu progreso actual por el del archivo. ¿Continuar?')){
      stats = data.stats;
      saveStats(stats);
      go('stats');
    }
  };
  reader.readAsText(file);
}

function renderStatsPage(){
  const rows = topicBreakdown();
  app.innerHTML = `
    ${headerHTML('Estadísticas','Por materia')}
    <a class="back-link" id="back">‹ Volver</a>
    <div class="panel">
      ${rows.map(r=>`
        <div style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:4px;">
            <span>${escapeHTML(r.name)}</span>
            <span style="color:var(--ink-soft);">${r.pct===null ? 'sin practicar' : r.pct+'%'}</span>
          </div>
          <div style="height:6px;background:var(--line);border-radius:4px;overflow:hidden;">
            <div style="height:100%;width:${r.pct===null?0:r.pct}%;background:var(--accent);"></div>
          </div>
          <div style="font-size:.72rem;color:var(--ink-soft);margin-top:3px;">${r.attempted} / ${r.total} preguntas practicadas</div>
        </div>
      `).join('')}
    </div>
    <div class="panel" style="margin-top:16px;">
      <h3 style="margin-top:0;">Copia de seguridad</h3>
      <p style="color:var(--ink-soft);font-size:.82rem;">Tu progreso vive solo en este navegador. Descárgalo para no perderlo si cambias de móvil o lo borras.</p>
      <button class="btn secondary" id="exportBtn">⬇ Exportar progreso</button>
      <button class="btn secondary" id="importBtn" style="margin-top:10px;">⬆ Restaurar desde un archivo</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
  `;
  attachThemeToggle();
  document.getElementById('back').onclick = ()=>go('home');
  document.getElementById('exportBtn').onclick = exportProgress;
  document.getElementById('importBtn').onclick = ()=>document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = (e)=>{
    if(e.target.files[0]) importProgressFile(e.target.files[0]);
  };
}

function renderSetupFull(){
  const total = EHU_QUESTIONS.length;
  const selectedTopics = new Set();
  app.innerHTML = `
    ${headerHTML('Batería completa','Configura tu sesión')}
    <a class="back-link" id="back">‹ Volver</a>
    <div class="panel">
      <h3>Buscar por palabra clave</h3>
      <p style="color:var(--ink-soft);font-size:.82rem;margin-top:-8px;">Si escribes algo aquí, se ignoran la materia y el rango de abajo.</p>
      <input type="text" id="searchBox" placeholder="Ej: euskera, presupuesto, jubilación..." style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:.95rem;">
      <h3 style="margin-top:22px;">Materia</h3>
      <p style="color:var(--ink-soft);font-size:.82rem;margin-top:-8px;">Elige una o varias. Si no eliges ninguna, se usa el rango de abajo.</p>
      <div class="topic-chips" id="topicChips">
        ${TOPIC_LIST.map((t,ti)=>`<button type="button" class="chip" data-t="${ti}">${escapeHTML(t)}</button>`).join('')}
      </div>
      <h3 style="margin-top:22px;">Rango de preguntas</h3>
      <div class="row2">
        <div class="field"><label>Desde</label><input type="number" id="from" min="1" max="${total}" value="1"></div>
        <div class="field"><label>Hasta</label><input type="number" id="to" min="1" max="${total}" value="${total}"></div>
      </div>
      <div class="toggle-row">
        <span>Orden aleatorio</span>
        <label class="switch"><input type="checkbox" id="rand" checked><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <span>Corrección inmediata</span>
        <label class="switch"><input type="checkbox" id="instant" checked><span class="slider"></span></label>
      </div>
      <div class="field" style="margin-top:16px;" id="timeField">
        <label>Tiempo límite (minutos, 0 = sin límite)</label>
        <input type="number" id="timelimit" min="0" value="0">
      </div>
      <div class="toggle-row">
        <span>Modo estudio (ver la respuesta ya marcada, sin puntuar ni cronómetro)</span>
        <label class="switch"><input type="checkbox" id="study"><span class="slider"></span></label>
      </div>
      <button class="btn" id="start">Empezar</button>
    </div>
  `;
  attachThemeToggle();
  document.getElementById('back').onclick = ()=>go('home');

  document.querySelectorAll('#topicChips .chip').forEach(btn=>{
    btn.onclick = ()=>{
      const ti = btn.dataset.t;
      if(selectedTopics.has(ti)){ selectedTopics.delete(ti); btn.classList.remove('on'); }
      else{ selectedTopics.add(ti); btn.classList.add('on'); }
    };
  });

  const studyBox = document.getElementById('study');
  const instantBox = document.getElementById('instant');
  const timeField = document.getElementById('timeField');
  studyBox.onchange = ()=>{
    const on = studyBox.checked;
    instantBox.disabled = on;
    timeField.style.opacity = on ? .4 : 1;
    document.getElementById('timelimit').disabled = on;
  };

  document.getElementById('start').onclick = ()=>{
    const searchTerm = document.getElementById('searchBox').value.trim();
    let pool;
    if(searchTerm){
      const nq = normalizeText(searchTerm);
      pool = EHU_QUESTIONS.filter(q => normalizeText(q[1] + ' ' + q[2].join(' ')).includes(nq));
    } else if(selectedTopics.size > 0){
      const chosenNames = [...selectedTopics].map(ti=>TOPIC_LIST[ti]);
      pool = EHU_QUESTIONS.filter(q => chosenNames.includes(EHU_TOPICS[q[0]] || 'Otros'));
    } else {
      let from = parseInt(document.getElementById('from').value)||1;
      let to = parseInt(document.getElementById('to').value)||total;
      from = Math.min(Math.max(1,from), total);
      to = Math.min(Math.max(1,to), total);
      if(from>to){ [from,to]=[to,from]; }
      pool = EHU_QUESTIONS.filter(q=>q[0]>=from && q[0]<=to);
    }
    if(pool.length === 0){
      alert('No hay preguntas con esa selección. Revisa la búsqueda, la materia o el rango.');
      return;
    }
    if(document.getElementById('rand').checked) pool = shuffle(pool);
    const isStudy = studyBox.checked;
    const timeLimit = isStudy ? 0 : (parseInt(document.getElementById('timelimit').value)||0);
    startSession({
      questions: pool,
      mode: isStudy ? 'study' : 'full',
      instant: isStudy ? true : document.getElementById('instant').checked,
      timeLimitSec: timeLimit>0 ? timeLimit*60 : 0,
      penalize:false
    });
  };
}

function renderSetupFails(){
  const failNums = Object.keys(stats).filter(n=>stats[n].lastWrong).map(Number);
  app.innerHTML = `
    ${headerHTML('Repaso de fallos','')}
    <a class="back-link" id="back">‹ Volver</a>
    <div class="panel">
      <h3>${failNums.length} preguntas falladas</h3>
      <p style="color:var(--ink-soft);font-size:.86rem;">Se marcan como superadas en cuanto las aciertes una vez.</p>
      <button class="btn" id="start">Empezar repaso</button>
    </div>
  `;
  attachThemeToggle();
  document.getElementById('back').onclick = ()=>go('home');
  document.getElementById('start').onclick = ()=>{
    if(failNums.length === 0) return;
    let pool = shuffle(failNums.map(n=>questionByNum(n)));
    startSession({questions:pool, mode:'fails', instant:true, timeLimitSec:0, penalize:false});
  };
}

function startSimulacro(){
  const pool = shuffle(EHU_QUESTIONS).slice(0,60);
  startSession({
    questions: pool,
    mode:'sim',
    instant:false,
    timeLimitSec: 80*60,
    penalize:false
  });
}

function startSession(cfg){
  session = {
    questions: cfg.questions,
    idx: 0,
    answers: new Array(cfg.questions.length).fill(null), // selected option idx or null
    flags: new Array(cfg.questions.length).fill(false),
    mode: cfg.mode,
    instant: cfg.instant,
    timeLimitSec: cfg.timeLimitSec,
    remaining: cfg.timeLimitSec,
    startedAt: Date.now(),
    finished:false
  };
  go('quiz');
}

function renderQuizStudy(){
  const total = session.questions.length;
  const i = session.idx;
  const q = session.questions[i];
  const [num, stem, opts] = q;
  const okSet = correctSet(q);

  app.innerHTML = `
    ${headerHTML('Modo estudio','')}
    <div class="quiz-top">
      <span>Pregunta ${i+1} / ${total} · <a class="stop-link" id="stopBtn">Terminar</a></span>
      <span></span>
    </div>
    <div class="progress-bar"><div class="fill" style="width:${Math.round(100*(i+1)/total)}%"></div></div>
    <div class="q-num">PREGUNTA ${num}</div>
    <p class="q-stem">${escapeHTML(stem)}</p>
    ${okSet.length>1 ? '<p style="color:var(--ink-soft);font-size:.8rem;margin-top:-14px;">Pregunta con error reconocido en el enunciado original: se aceptan dos respuestas.</p>' : ''}
    <div class="options" id="opts">
      ${opts.map((o,oi)=>`
        <button class="opt disabled ${okSet.includes(oi)?'correct':''}" data-i="${oi}" disabled>
          <span class="tag">${String.fromCharCode(65+oi)}</span>
          <span>${escapeHTML(o)}</span>
        </button>
      `).join('')}
    </div>
    <div class="quiz-nav">
      <button class="flag-btn ${session.flags[i]?'on':''}" id="flagBtn" title="Marcar para repasar">🚩</button>
      <button class="btn secondary" id="prevBtn" ${i===0?'disabled':''} style="flex:1;">Anterior</button>
      <button class="btn" id="nextBtn" style="flex:1;">${i===total-1 ? 'Terminar' : 'Siguiente'}</button>
    </div>
  `;
  attachThemeToggle();

  document.getElementById('stopBtn').onclick = ()=>{
    if(confirm('¿Terminar la sesión de estudio ahora? Verás el resumen de lo repasado hasta esta pregunta.')){
      session.questions = session.questions.slice(0, i+1);
      session.flags = session.flags.slice(0, i+1);
      finishSession();
    }
  };
  document.getElementById('flagBtn').onclick = ()=>{
    session.flags[i] = !session.flags[i];
    document.getElementById('flagBtn').classList.toggle('on', session.flags[i]);
  };
  document.getElementById('prevBtn').onclick = ()=>{
    session.idx = Math.max(0, session.idx-1);
    render('quiz');
  };
  document.getElementById('nextBtn').onclick = ()=>{
    if(i === total-1){ finishSession(); }
    else{ session.idx++; render('quiz'); }
  };
}

function renderQuiz(){
  if(!session) return go('home');
  if(session.mode === 'study') return renderQuizStudy();
  const total = session.questions.length;
  const i = session.idx;
  const q = session.questions[i];
  const [num, stem, opts] = q;
  const selected = session.answers[i];
  const answered = selected !== null;

  const title = session.mode==='sim' ? 'Simulacro' : session.mode==='fails' ? 'Repaso de fallos' : 'Batería completa';

  app.innerHTML = `
    ${headerHTML(title,'')}
    <div class="quiz-top">
      <span>Pregunta ${i+1} / ${total} · <a class="stop-link" id="stopBtn">Terminar</a></span>
      <span class="timer" id="timer">${session.timeLimitSec ? fmtTime(session.remaining) : ''}</span>
    </div>
    <div class="progress-bar"><div class="fill" style="width:${Math.round(100*(i+1)/total)}%"></div></div>
    <div class="q-num">PREGUNTA ${num}</div>
    <p class="q-stem">${escapeHTML(stem)}</p>
    <div class="options" id="opts">
      ${opts.map((o,oi)=>`
        <button class="opt" data-i="${oi}">
          <span class="tag">${String.fromCharCode(65+oi)}</span>
          <span>${escapeHTML(o)}</span>
        </button>
      `).join('')}
    </div>
    <div class="quiz-nav">
      <button class="flag-btn ${session.flags[i]?'on':''}" id="flagBtn" title="Marcar para repasar">🚩</button>
      <button class="btn secondary" id="prevBtn" ${i===0?'disabled':''} style="flex:1;">Anterior</button>
      <button class="btn" id="nextBtn" style="flex:1;">${i===total-1 ? 'Terminar' : 'Siguiente'}</button>
    </div>
  `;
  attachThemeToggle();

  // pintar estado ya respondido si volvemos a una pregunta
  if(answered){
    if(session.instant){
      paintAnswer(i, selected);
    } else {
      markSelectedOnly(i, selected);
    }
  }

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      if(session.instant && session.answers[i] !== null) return; // ya respondida en modo inmediato
      const oi = parseInt(btn.dataset.i);
      session.answers[i] = oi;
      if(session.instant){
        const wasCorrect = isCorrect(q, oi);
        recordAnswer(num, wasCorrect);
        paintAnswer(i, oi);
      } else {
        markSelectedOnly(i, oi);
      }
    };
  });

  document.getElementById('stopBtn').onclick = ()=>{
    if(confirm('¿Terminar ahora? Verás el resultado con lo que hayas respondido hasta esta pregunta; el resto contará como sin responder.')){
      finishSession();
    }
  };
  document.getElementById('flagBtn').onclick = ()=>{
    session.flags[i] = !session.flags[i];
    document.getElementById('flagBtn').classList.toggle('on', session.flags[i]);
  };
  document.getElementById('prevBtn').onclick = ()=>{
    session.idx = Math.max(0, session.idx-1);
    render('quiz');
  };
  document.getElementById('nextBtn').onclick = ()=>{
    if(i === total-1){
      finishSession();
    } else {
      session.idx++;
      render('quiz');
    }
  };

  // temporizador
  if(session.timeLimitSec && !timerInterval){
    timerInterval = setInterval(()=>{
      session.remaining--;
      const t = document.getElementById('timer');
      if(t){
        t.textContent = fmtTime(Math.max(0,session.remaining));
        t.classList.toggle('low', session.remaining <= 60);
      }
      if(session.remaining <= 0){
        clearInterval(timerInterval);
        timerInterval = null;
        finishSession();
      }
    },1000);
  }
}

function markSelectedOnly(i, selectedIdx){
  document.querySelectorAll('.opt').forEach(btn=>{
    const oi = parseInt(btn.dataset.i);
    btn.classList.toggle('selected', oi === selectedIdx);
  });
}

function paintAnswer(i, selectedIdx){
  const q = session.questions[i];
  const okSet = correctSet(q);
  document.querySelectorAll('.opt').forEach(btn=>{
    const oi = parseInt(btn.dataset.i);
    btn.classList.add('disabled');
    btn.disabled = true;
    if(okSet.includes(oi)) btn.classList.add('correct');
    else if(oi === selectedIdx) btn.classList.add('incorrect');
  });
}

function finishSession(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  if(!session.instant){
    // en modo no inmediato las respuestas no se han contabilizado todavía: se registran una sola vez aquí
    session.questions.forEach((q,i)=>{
      const sel = session.answers[i];
      if(sel !== null){
        recordAnswer(q[0], isCorrect(q, sel));
      }
    });
  }
  session.finished = true;
  go('results');
}

function renderResults(){
  if(!session) return go('home');
  const total = session.questions.length;

  if(session.mode === 'study'){
    const flagList = [];
    const allRows = [];
    session.questions.forEach((q,i)=>{
      const [num, stem, opts] = q;
      const okSet = correctSet(q);
      allRows.push({num, stem, opts, okSet});
      if(session.flags[i]) flagList.push({num, stem, opts, okSet});
    });
    app.innerHTML = `
      ${headerHTML('Modo estudio','')}
      <div class="result-hero no-print">
        <div class="score">${total}</div>
        <div class="label">preguntas repasadas</div>
      </div>
      <div class="no-print">
      ${flagList.length ? `<h3 style="font-family:var(--serif);font-weight:normal;">Marcadas para repasar (${flagList.length})</h3>
      <div>${flagList.map(f=>`
        <div class="fail-item">
          <div class="q-num">PREGUNTA ${f.num}</div>
          <div class="stem">${escapeHTML(f.stem)}</div>
          ${f.okSet.map(ci=>`<div class="ans correct">${String.fromCharCode(65+ci)}) ${escapeHTML(f.opts[ci])}</div>`).join('')}
        </div>`).join('')}</div>` : ''}
      </div>
      <div class="quiz-nav no-print">
        <button class="btn secondary" id="pdfBtn" style="flex:1;">📄 Descargar PDF</button>
        <button class="btn" id="homeBtn" style="flex:1;">Volver al inicio</button>
      </div>
      ${buildPrintReport('Modo estudio · Test EHU', `${total} preguntas repasadas`, allRows)}
    `;
    attachThemeToggle();
    document.getElementById('homeBtn').onclick = ()=>{ session=null; go('home'); };
    document.getElementById('pdfBtn').onclick = downloadPDF;
    return;
  }

  let correct = 0, unanswered = 0;
  const failList = [];
  const flagList = [];
  const allRows = [];
  session.questions.forEach((q,i)=>{
    const [num, stem, opts] = q;
    const okSet = correctSet(q);
    const sel = session.answers[i];
    const isFlagged = session.flags[i];
    allRows.push({num, stem, opts, okSet, sel});
    if(sel === null){ unanswered++; }
    else if(okSet.includes(sel)){ correct++; }
    else{ failList.push({num, stem, opts, okSet, sel}); }
    if(isFlagged){
      flagList.push({num, stem, opts, okSet, sel});
    }
  });
  const pct = total ? Math.round(100*correct/total) : 0;

  const title = session.mode==='sim' ? 'Resultado del simulacro' : 'Resultado';

  function itemHTML(f){
    const selLine = f.sel === null
      ? `<div class="ans">Sin responder.</div>`
      : (f.okSet.includes(f.sel) ? '' : `<div class="ans incorrect">${String.fromCharCode(65+f.sel)}) ${escapeHTML(f.opts[f.sel])}</div>`);
    const correctLines = f.okSet.map(ci=>`<div class="ans correct">${String.fromCharCode(65+ci)}) ${escapeHTML(f.opts[ci])}</div>`).join('');
    return `
      <div class="fail-item">
        <div class="q-num">PREGUNTA ${f.num}</div>
        <div class="stem">${escapeHTML(f.stem)}</div>
        ${selLine}
        ${correctLines}
      </div>`;
  }

  app.innerHTML = `
    ${headerHTML(title,'')}
    <div class="result-hero no-print">
      <div class="score">${correct} / ${total}</div>
      <div class="label">${pct}% de aciertos ${unanswered? ' · '+unanswered+' sin responder':''}</div>
    </div>
    <div class="no-print">
    ${failList.length ? `<h3 style="font-family:var(--serif);font-weight:normal;">Fallos (${failList.length})</h3>
    <div>${failList.map(itemHTML).join('')}</div>` : ''}
    ${flagList.length ? `<h3 style="font-family:var(--serif);font-weight:normal;">Marcadas para repasar (${flagList.length})</h3>
    <div>${flagList.map(itemHTML).join('')}</div>` : ''}
    </div>
    <div class="quiz-nav no-print">
      <button class="btn secondary" id="pdfBtn" style="flex:1;">📄 Descargar PDF</button>
      <button class="btn" id="homeBtn" style="flex:1;">Volver al inicio</button>
    </div>
    ${buildPrintReport(title+' · Test EHU', `${correct} de ${total} correctas (${pct}%)${unanswered? ' · '+unanswered+' sin responder':''}`, allRows)}
  `;
  attachThemeToggle();
  document.getElementById('homeBtn').onclick = ()=>{ session=null; go('home'); };
  document.getElementById('pdfBtn').onclick = downloadPDF;
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function buildPrintReport(titleText, subText, rows){
  const items = rows.map(r=>{
    let selLine = '';
    if(r.sel === undefined){
      // modo estudio: no hay seleccion, solo mostramos la respuesta correcta
    } else if(r.sel === null){
      selLine = `<div class="ans">Tu respuesta: sin responder.</div>`;
    } else if(r.okSet.includes(r.sel)){
      selLine = `<div class="ans correct">Tu respuesta: ${String.fromCharCode(65+r.sel)}) ${escapeHTML(r.opts[r.sel])} ✓</div>`;
    } else {
      selLine = `<div class="ans incorrect">Tu respuesta: ${String.fromCharCode(65+r.sel)}) ${escapeHTML(r.opts[r.sel])}</div>`;
    }
    const correctLines = (r.sel !== undefined && r.sel !== null && r.okSet.includes(r.sel)) ? '' :
      r.okSet.map(ci=>`<div class="ans correct">Correcta: ${String.fromCharCode(65+ci)}) ${escapeHTML(r.opts[ci])}</div>`).join('');
    return `<div class="print-item">
      <div class="q-num">PREGUNTA ${r.num}</div>
      <div class="stem">${escapeHTML(r.stem)}</div>
      ${selLine}
      ${correctLines}
    </div>`;
  }).join('');
  return `<div class="print-only">
    <div class="print-header">
      <h1>${escapeHTML(titleText)}</h1>
      <p>${escapeHTML(subText)}</p>
    </div>
    ${items}
  </div>`;
}

function downloadPDF(){
  window.print();
}

/* ============ Arranque ============ */
go('home');

const SPLASH_MIN_MS = 700;
const splashStart = Date.now();
function hideSplash(){
  const el = document.getElementById('splash');
  if(!el) return;
  const elapsed = Date.now() - splashStart;
  const wait = Math.max(0, SPLASH_MIN_MS - elapsed);
  setTimeout(()=>{
    el.classList.add('hide');
    setTimeout(()=>el.remove(), 400);
  }, wait);
}
if(document.readyState === 'complete'){
  hideSplash();
} else {
  window.addEventListener('load', hideSplash);
}

/* ============ Service worker ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
